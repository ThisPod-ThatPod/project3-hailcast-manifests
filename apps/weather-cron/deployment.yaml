# weather-cron — Open-Meteo에서 NYC 예보를 4시간마다 수집해 S3 weather/*에 쓴다.
# app repo k8s/weather-cron-deployment.yaml 참고, 우리 레포 스타일(개별 env)로 이관.
#
# 배포 방식: 앱 내부 스케줄러가 4시간 간격을 관리하므로 상시 Deployment로 운영한다
# (backend/weather-cron/schedulers).
#
# 외부 노출 없음: 8002는 /healthz 프로브 전용이라 Ingress를 만들지 않는다.
# (규약서 §8-5 경로 표에도 weather-cron 항목이 없다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailcast-weather-cron
  namespace: hailcast
  labels:
    app: hailcast-weather-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hailcast-weather-cron
  template:
    metadata:
      labels:
        app: hailcast-weather-cron
    spec:
      serviceAccountName: weather-cron-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: weather-cron
          image: 797452357900.dkr.ecr.ap-northeast-2.amazonaws.com/hailcast-dev-weather-cron:a54de5f
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: JSON_STORE_BACKEND
              value: "s3"
            - name: S3_BUCKET
              value: "hailcast-dev-model-artifacts-58b4f8fd"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10