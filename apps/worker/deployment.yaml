apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailcast-worker
  namespace: hailcast
  labels:
    app: hailcast-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hailcast-worker
  template:
    metadata:
      labels:
        app: hailcast-worker
    spec:
      serviceAccountName: worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: 797452357900.dkr.ecr.ap-northeast-2.amazonaws.com/hailcast-dev-worker:3dd70a5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources: # ⑧ Karpenter 오토스케일링 시연용 
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          # 하트비트 파일 최신성으로 실제 폴링 동작 여부를 판단한다(app PR#49,
          # 2026-08-18 반영). poll_once() 성공마다 갱신되고, SQS 접근 자체가
          # AwsError로 실패하는 경로에서는 안 찍는다 — pgrep(프로세스 생존만
          # 확인) 대비 "실제로 멈춤"을 감지할 수 있다.
          # 신선도 1분: sqs_long_poll_seconds=20초 대비 3배 여유.
          # initialDelaySeconds 30: 첫 폴링이 롱폴링(최대 20초)이라 하트비트가
          # 20초 시점에야 처음 생길 수 있음 — 15초로 두면 오탐 재시작 위험.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "find /var/run/heartbeat/worker.heartbeat -mmin -1 | grep -q ."
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: heartbeat
              mountPath: /var/run/heartbeat
          env:
            - name: SQS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/797452357900/hailcast-dev-call-queue"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: hailcast-rds-secret
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "hailcast"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hailcast-rds-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hailcast-rds-secret
                  key: DB_PASSWORD
      volumes:
        - name: heartbeat
          emptyDir: {}