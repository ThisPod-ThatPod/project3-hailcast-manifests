apiVersion: v1
kind: Service
metadata:
  name: hailcast-call-api
  namespace: hailcast
  labels:
    app: hailcast-call-api
spec:
  selector:
    app: hailcast-call-api
  # name: http 는 생략하면 안 된다 — ServiceMonitor 의 endpoints[].port 는
  # 포트 "이름"을 참조하므로(번호가 아니다), 이름이 없으면 스크레이프 대상이
  # 0개가 된다. 에러가 아니라 "타겟이 안 잡히는" 형태라 조용히 실패한다.
  # Ingress 는 포트를 번호(number: 8000)로 참조하므로 이름 추가는 비파괴적이다.
  ports:
    - name: http
      port: 8000
      targetPort: http