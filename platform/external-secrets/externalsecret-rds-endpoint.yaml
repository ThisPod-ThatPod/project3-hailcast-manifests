# RDS 엔드포인트(Parameter Store, 비용 절감을 위해 일반 설정값은 여기 저장)
# → 같은 hailcast-rds-secret에 DB_HOST 키로 병합(Merge)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-endpoint
  namespace: hailcast
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: hailcast-rds-secret
    creationPolicy: Merge   # rds-credentials와 동일하게 Merge. 둘 다 생성 주체가 아니라
                            # 기존 Secret에 키만 병합한다 (0c67287 이후 상태)
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /hailcast/dev/rds/endpoint   # 네이밍규약서 §5-7과 정확히 일치