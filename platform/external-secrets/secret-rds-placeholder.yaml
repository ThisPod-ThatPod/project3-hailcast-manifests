# hailcast-rds-secret 빈 껍데기(placeholder)
#
# [왜 필요한가]
# rds-credentials·rds-endpoint 두 ExternalSecret이 둘 다 creationPolicy: Merge 라
# "이미 있는 Secret에 키만 넣는다". 없는 Secret은 못 만든다.
# 그래서 빈 클러스터로 재구축하면 이 Secret이 안 생기고,
# call-api·predict·worker 세 Deployment가 CreateContainerConfigError로 못 뜬다.
#
# 이 빈 Secret을 ExternalSecret보다 먼저 만들어 두면,
# Merge 두 개가 여기에 DB_HOST·DB_USER·DB_PASSWORD를 채워 넣는다.
#
# [순서 보장]
# 같은 Application(platform-secrets, wave 1) 안에서 이 파일이 ExternalSecret보다
# 먼저 적용되도록, 리소스 레벨 sync-wave를 더 작은 값으로 준다.
# ExternalSecret엔 sync-wave가 없으니(=0), 이 Secret은 -1로 둔다.
#
# [ArgoCD가 채워진 data를 도로 비우지 않게 하는 것]
# ESO가 채운 data는 git 매니페스트엔 없는 필드라, selfHeal이 "git엔 없으니
# 지워야지"라고 오판할 위험이 있다. 이건 이 파일의 annotation이 아니라
# argocd/applications/platform-secrets-app.yaml 의 ignoreDifferences로 막는다 —
# worker-app.yaml이 KEDA가 관리하는 /spec/replicas를 제외할 때 쓴 것과 같은
# 정석 패턴이다 (RespectIgnoreDifferences=true 와 함께 적용해야 selfHeal에도 먹힌다).
#
# [주의]
# data를 비워 둔다. 값을 넣지 않는다 — 값은 ExternalSecret이 채운다.
# 여기에 실제 비밀번호를 적으면 git에 시크릿이 남아 보안 원칙 위반이다.
apiVersion: v1
kind: Secret
metadata:
  name: hailcast-rds-secret
  namespace: hailcast
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
# data 없음 — 의도적으로 비움. ExternalSecret(Merge)이 채운다.
